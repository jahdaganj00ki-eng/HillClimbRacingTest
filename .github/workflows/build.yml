name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  PROJECT_NAME: "HillClimbRacing"
  EXPORT_NAME: "Windows Desktop"

jobs:
  build:
    name: Build Windows Executable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Setup Godot 4.3
        uses: awalsh128/cache-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Restore NuGet packages
        run: dotnet restore HillClimbRacing.csproj
        working-directory: ${{ github.workspace }}

      - name: Build C# project (Release)
        run: dotnet build HillClimbRacing.csproj -c Release --no-restore
        working-directory: ${{ github.workspace }}

      - name: Create build directory
        run: mkdir -p build

      - name: Export Windows build
        run: |
          godot --headless --export-release "${{ env.EXPORT_NAME }}" build/${{ env.PROJECT_NAME }}.exe
        working-directory: ${{ github.workspace }}
        env:
          GODOT_BIN: godot

      - name: Verify build output
        run: |
          ls -la build/
          file build/${{ env.PROJECT_NAME }}.exe
          file build/${{ env.PROJECT_NAME }}.pck

      - name: Package Windows release
        run: |
          cd build
          zip -r ../${{ env.PROJECT_NAME }}_Windows.zip ${{ env.PROJECT_NAME }}.exe ${{ env.PROJECT_NAME }}.pck
          cd ..
          ls -la ${{ env.PROJECT_NAME }}_Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_Windows
          path: ${{ env.PROJECT_NAME }}_Windows.zip
          retention-days: 30
          compression-level: 6

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_NAME }}_Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Basic Build Verification
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_Windows
          path: build_output

      - name: Verify executable exists
        run: |
          ls -la build_output/
          test -f build_output/${{ env.PROJECT_NAME }}.exe
          test -f build_output/${{ env.PROJECT_NAME }}.pck
          echo "Build artifacts verified successfully!"

      - name: Check file sizes
        run: |
          EXE_SIZE=$(stat -c%s "build_output/${{ env.PROJECT_NAME }}.exe")
          PCK_SIZE=$(stat -c%s "build_output/${{ env.PROJECT_NAME }}.pck")
          echo "EXE size: $((EXE_SIZE / 1024 / 1024)) MB"
          echo "PCK size: $((PCK_SIZE / 1024 / 1024)) MB"
          # Sanity check - should be reasonable sizes
          test $EXE_SIZE -gt 1000000  # At least 1MB
          test $PCK_SIZE -gt 1000000  # At least 1MB
